name: Ejecutar script SINADEF cada día a las 6:00 am

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install pandas requests pytz

      # Reintentos simples con bash
      - name: Ejecutar script con 5 reintentos
        run: |
          for i in {1..5}; do
            echo "🔄 Intento $i/5"
            if python procesar_datos.py; then
              echo "✅ Éxito en intento $i"
              break
            elif [ $i -eq 5 ]; then
              echo "❌ Falló después de 5 intentos"
              exit 1
            else
              echo "⏳ Esperando 60 segundos antes del siguiente intento..."
              sleep 60
            fi
          done

      - name: Configurar Git para el push automático
        run: |
          git config --global user.name "Judith Cristina Quiñones Inga"
          git config --global user.email "judithcristinaqi@gmail.com"

      - name: Subir CSV al repositorio
        run: |
          git add data/processed/BASE_FINAL_GENERAL.csv
          git commit -m "📦 CSV actualizado automáticamente - $(date -u)" || echo "Sin cambios para subir"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/JudithCristina/sinadef-automatizado.git HEAD:main
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
